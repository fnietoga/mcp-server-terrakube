apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.chartmetadata.name }}-secrets
spec:
  provider: azure
  parameters:
    usePodIdentity: "{{ .Values.secretProvider.identity.usePodIdentity | default "false" }}"
    useVMManagedIdentity: "{{ .Values.secretProvider.identity.useVMManagedIdentity | default "false" }}"
    clientID: {{ .Values.secretProvider.identity.clientID }}
    keyvaultName: {{ .Values.secretProvider.identity.keyvaultName }}
    cloudName: {{ .Values.secretProvider.identity.cloudName | default "" | quote }}
    objects: |
      array:
        - |
          objectName: {{ .Values.secretProvider.secret.objectName }}
          objectType: secret
    tenantId: {{ .Values.secretProvider.identity.tenantId }}
  secretObjects:
    - secretName: {{ .Values.chartmetadata.name }}-secrets
      type: Opaque
      data:
        - objectName: {{ .Values.secretProvider.secret.objectName }}
          key: {{ .Values.secretProvider.secret.key }}

