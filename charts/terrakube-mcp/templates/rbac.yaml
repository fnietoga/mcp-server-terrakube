apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    app: {{ .Values.chartmetadata.labels.app }}
    component: {{ .Values.chartmetadata.labels.component }}
{{- with .Values.serviceAccount.labels }}
{{- toYaml . | nindent 4 }}
{{- end }}
  annotations:
    # Required for Azure Workload Identity federation (pods request this SA via azure.workload.identity/use: "true")
    azure.workload.identity/client-id: {{ .Values.secretProvider.identity.clientID | quote }}
{{- with .Values.serviceAccount.annotations }}
{{- toYaml . | nindent 4 }}
{{- end }}
automountServiceAccountToken: true
