chartmetadata:
  name: terrakube-mcp
  labels:
    app: terrakube
    component: mcp

image:
  repository: "acrwedfnietoga01.azurecr.io/terrakube/mcp-server-terrakube" # dummy - replace with the actual image repository
  tag: "v0.1.1"
  pullPolicy: Always

replicaCount: 1 # HA baseline for production-like dev clusters

autoscaling: # HPA settings for terrakube-mcp
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

podDisruptionBudget: # PDB enabled for terrakube-mcp availability during node maintenance
  enabled: false
  minAvailable: 1

serviceAccount:
  name: "terrakube-mcp-sa"
  annotations: {}
  labels: {}

podLabels: {}
podAnnotations: {}

service:
  type: ClusterIP
  port: 8001
  targetPort: 8001
  protocol: TCP
  name: http
  annotations: {}
  labels: {}
  selector:
    app: terrakube
    component: mcp

resources:
  limits:
    cpu: 750m
    memory: 1.5Gi
  requests:
    cpu: 250m
    memory: 256Mi

nodeSelector: {}
  # caas/poolname: terrakube
tolerations: []
affinity: {}

securityContext: {}
containerSecurityContext: {}

# -- Gateway API route configuration, mirrors the grafana chart's `route:` block
# TLS is terminated by the parent Gateway using the externally-provisioned "tls-secret-terrakube"
# certificate secret (created by another process) - this chart does not manage it.
route:
  main:
    enabled: true
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    annotations: {}
    labels: {}
    hostnames:
      - "terrakube-api.poc.fnietoga.me"
    parentRefs:
      - name: "external-gateway" # dummy - replace with the actual Gateway name
        namespace: "aks-istio-system" # dummy - replace with the actual Gateway namespace
    matches:
      - path:
          type: PathPrefix
          value: /mcp

# Azure Key Vault backed TLS secret, mounted via the Secrets Store CSI driver
secretProvider:
  identity:
    tenantId: "613c9f59-45bd-41b1-8e2a-e7736e788431"
    clientID: "40b10568-9d95-44e5-8831-e41b5691d570"
    keyvaultName: "kv-we-d-terrakube-02"
  secret:
    objectName: "terrakube-pat-token" # must exist in kv-we-d-terrakube-02
    key: "terrakube-pat-token"

# Terrakube API connection - only these two vars are read by src/config.ts
terrakube:
  apiUrl: "https://terrakube-api.poc.fnietoga.me"
